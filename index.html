<script>

const startButton = document.getElementById("startButton");
const envelope = document.getElementById("envelope");
const reveal = document.getElementById("revelacion");
const tapHint = document.getElementById("tapHint");
const heartsContainer = document.getElementById("heartsContainer");

let envelopeOpened = false;


/* =========================================================
   TIEMPOS
========================================================= */

/*
   10 segundos esperando
   7 segundos abriendo
   40 segundos abiertas
   7 segundos cerrando
*/

const WAIT_BEFORE_OPEN = 10000;
const OPEN_DURATION = 40000;


/* =========================================================
   IR A UNA SECCIÓN
========================================================= */

function scrollToElement(element) {

    if (!element) return;

    element.scrollIntoView({
        behavior: "smooth",
        block: "start"
    });

}


/* =========================================================
   BOTÓN DE LA PORTADA
========================================================= */

startButton.addEventListener("click", function () {

    scrollToElement(
        document.getElementById("carta")
    );

});


/* =========================================================
   CORAZONES
========================================================= */

function createHearts() {

    for (let i = 0; i < 35; i++) {

        const heart = document.createElement("span");

        heart.className = "floating-heart";

        heart.textContent =
            Math.random() > 0.5 ? "♡" : "♥";

        heart.style.left =
            (35 + Math.random() * 30) + "%";

        heart.style.setProperty(
            "--x",
            ((Math.random() - 0.5) * 420) + "px"
        );

        heart.style.setProperty(
            "--rotate",
            ((Math.random() - 0.5) * 80) + "deg"
        );

        heart.style.animationDelay =
            (Math.random() * 1.2) + "s";

        heart.style.fontSize =
            (12 + Math.random() * 16) + "px";

        heartsContainer.appendChild(heart);

        setTimeout(function () {
            heart.remove();
        }, 5000);

    }

}


/* =========================================================
   ABRIR EL SOBRE
========================================================= */

function openEnvelope() {

    if (envelopeOpened) return;

    envelopeOpened = true;


    /* Abrimos el sobre */

    envelope.classList.add("open");


    tapHint.textContent =
        "La sorpresa está a punto de comenzar...";


    /* Corazones */

    createHearts();


    /*
       Esperamos 1.5 segundos para que
       se vea primero la animación del sobre.
    */

    setTimeout(function () {


        /*
           Vamos a la sección de las cortinas.

           IMPORTANTE:
           Todavía NO añadimos .open.

           Por eso las cortinas permanecen
           completamente cerradas.
        */

        scrollToElement(reveal);


        /*
           ESPERA REAL:

           Las cortinas permanecen cerradas
           durante 10 segundos.
        */

        setTimeout(function () {


            /*
               Ahora sí comienza la apertura.

               El CSS se encarga de que tarde
               7 segundos en abrirse.
            */

            reveal.classList.add("open");


            /*
               MUY IMPORTANTE:

               Este contador empieza AHORA,
               cuando las cortinas ya empiezan
               a abrirse.

               Cuando pasan 40 segundos,
               se cierran.
            */

            setTimeout(function () {


                reveal.classList.remove("open");


            }, OPEN_DURATION);


        }, WAIT_BEFORE_OPEN);


    }, 1500);

}


/* =========================================================
   CLICK EN EL SOBRE
========================================================= */

envelope.addEventListener(
    "click",
    openEnvelope
);


/* =========================================================
   TECLADO
========================================================= */

envelope.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter" ||
            event.key === " "
        ) {

            event.preventDefault();

            openEnvelope();

        }

    }
);

</script>
